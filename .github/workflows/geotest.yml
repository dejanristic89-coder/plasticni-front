name: Geo test (Android APK)

on:
  push:
    branches: [main]
    paths: ['geotest/**', '.github/workflows/geotest.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geotest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK paketi
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;34.0.0" | tail -3

      - name: Provera ARCore ključa
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          if [ -z "$ARCORE_API_KEY" ]; then
            echo "::warning::Nema tajne ARCORE_API_KEY - aplikacija će se napraviti, ali Geospatial neće raditi."
          else
            echo "ARCore ključ postoji."
          fi

      - name: Pravljenje APK fajla
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee ../build.log; then
            # greške kao anotacija (da se vide bez preuzimanja loga)
            msg=$(grep -v "^\s*$" ../build.log | grep -v "sys-img\|UnmarshalException\|XML parse" | tail -45 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle greska::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../PF-geotest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PF-geotest
          path: PF-geotest.apk

      - name: Objavi za preuzimanje na telefonu
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete geotest --yes --cleanup-tag || true
          gh release create geotest PF-geotest.apk \
            --title "Geo test - poslednja verzija" \
            --notes "Napravljeno $(date -u '+%d.%m.%Y %H:%M') UTC iz ${GITHUB_SHA::7}. Preuzmi PF-geotest.apk na telefonu i instaliraj." \
            --latest
