name: Geo test (Android APK)

on:
  push:
    branches: [main]
    paths: ['geotest/**', '.github/workflows/geotest.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geotest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provera ARCore ključa
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          if [ -z "$ARCORE_API_KEY" ]; then
            echo "::warning::Nema tajne ARCORE_API_KEY - aplikacija će se napraviti, ali Geospatial neće raditi."
          else
            echo "ARCore ključ postoji."
          fi

      - name: Pravljenje APK fajla
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PF-geotest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PF-geotest
          path: PF-geotest.apk

      - name: Objavi za preuzimanje na telefonu
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete geotest --yes --cleanup-tag || true
          gh release create geotest PF-geotest.apk \
            --title "Geo test - poslednja verzija" \
            --notes "Napravljeno $(date -u '+%d.%m.%Y %H:%M') UTC iz ${GITHUB_SHA::7}. Preuzmi PF-geotest.apk na telefonu i instaliraj." \
            --latest
